# Apache virtual host for seafile. Copy to /etc/apache2/sites-available/, adjust the
# domain and certificate paths, then:
#   a2enmod ssl proxy proxy_http proxy_wstunnel headers && a2ensite seafile
# The public address must match SEAFILE_SERVER_PROTOCOL/SEAFILE_SERVER_HOSTNAME and
# NOTIFICATION_SERVER_URL in /etc/seafile/seafile.env.

<VirtualHost *:80>
    ServerName seafile.example.com
    Redirect permanent / https://seafile.example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName seafile.example.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/seafile.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/seafile.example.com/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    # no request size limit for uploads
    LimitRequestBody 0

    # trailing slashes on both sides strip the path prefix
    # file server
    ProxyPass        /seafhttp/ http://127.0.0.1:8082/ timeout=36000
    ProxyPassReverse /seafhttp/ http://127.0.0.1:8082/
    # notification server (websocket); /notification/ping must precede /notification
    ProxyPass        /notification/ping http://127.0.0.1:8083/ping
    ProxyPass        /notification ws://127.0.0.1:8083/ upgrade=websocket
    ProxyPassReverse /notification ws://127.0.0.1:8083/
    # WebDAV (seafdav.service); the path is forwarded as is, a browser's directory
    # listing loads its assets from /:dir_browser/
    # mod_proxy maps before mod_alias, so keep the bare path out of "ProxyPass /" for the redirect
    ProxyPassMatch   ^/seafdav$ !
    RedirectMatch permanent ^/seafdav$ /seafdav/
    ProxyPass        /seafdav/ http://127.0.0.1:8080/seafdav/ timeout=1200
    ProxyPassReverse /seafdav/ http://127.0.0.1:8080/seafdav/
    ProxyPass        /:dir_browser/ http://127.0.0.1:8080/:dir_browser/
    # seahub
    ProxyPass        / http://127.0.0.1:8000/ timeout=1200
    ProxyPassReverse / http://127.0.0.1:8000/
</VirtualHost>
