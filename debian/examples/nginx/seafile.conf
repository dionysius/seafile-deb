# nginx site for seafile. Copy to /etc/nginx/sites-available/, adjust the domain and
# certificate paths, enable with `ln -s ../sites-available/seafile /etc/nginx/sites-enabled/`.
# The public address must match SEAFILE_SERVER_PROTOCOL/SEAFILE_SERVER_HOSTNAME and
# NOTIFICATION_SERVER_URL in /etc/seafile/seafile.env.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name seafile.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name seafile.example.com;

    ssl_certificate     /etc/letsencrypt/live/seafile.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seafile.example.com/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # seahub
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_read_timeout 1200s;
    }

    # file server; the trailing slashes strip the path prefix
    location /seafhttp/ {
        proxy_pass http://127.0.0.1:8082/;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 36000s;
        proxy_send_timeout 36000s;
    }

    # notification server (websocket)
    location /notification/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # WebDAV (seafdav.service); the path is forwarded as is and must match share_name
    # in seafdav.conf, a browser's directory listing loads its assets from /:dir_browser/
    location = /seafdav {
        return 301 $scheme://$host/seafdav/;
    }
    location /seafdav/ {
        proxy_pass http://127.0.0.1:8080;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
    }
    location /:dir_browser/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Optional: serve the shipped static files directly; uploaded avatars and custom
    # branding live outside this tree and fall back to seahub.
    #location /media/ {
    #    root /usr/lib/seahub/seahub;
    #    try_files $uri @seahub;
    #}
    #location @seahub {
    #    proxy_pass http://127.0.0.1:8000;
    #}
}
