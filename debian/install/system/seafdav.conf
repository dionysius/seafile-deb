# seafdav (WebDAV access to the libraries) configuration. Reference:
# https://manual.seafile.com/13.0/extension/webdav/
#
# Enable the server with `systemctl enable --now seafdav` and route /seafdav/
# through the reverse proxy (see the shipped examples). Users authenticate with
# their account password, or with the separate WebDAV password set in their
# profile (ENABLE_WEBDAV_SECRET in seahub_settings.py, required with two-factor
# authentication).
#
# Upstream's enabled/host/port keys are read by its seafile-controller, which
# this packaging doesn't ship: the service is toggled with systemctl and listens
# on 127.0.0.1:8080, changeable through a drop-in (`systemctl edit seafdav`).

[WEBDAV]
# URL path the libraries are served under; the reverse proxy forwards it as is.
share_name = /seafdav
# Threads serving requests.
#workers = 5
# Request timeout in seconds.
#timeout = 1200
# Append the library id to library names, telling apart equally named ones.
#show_repo_id = false
