# seafdav (WebDAV access to the libraries). Reference:
# https://manual.seafile.com/14.0/extension/webdav/
#
# The server is toggled and tuned in seafile.env (ENABLE_SEAFDAV, SEAFDAV_WORKERS)
# and listens on 127.0.0.1:8080, changeable through a drop-in (`systemctl edit
# seafdav`). Users authenticate with their account password, or with the separate
# WebDAV password set in their profile (required with two-factor authentication).
# Only seahub reads this file.

[WEBDAV]
# Path of the WebDAV address shown in the user profile. seafdav serves the
# libraries under /seafdav; the reverse proxy forwards it as is.
share_name = /seafdav
