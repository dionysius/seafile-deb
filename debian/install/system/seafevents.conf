# seafevents (background tasks: async email, search indexing, statistics,
# library auto-expiry, virus scanning) configuration. Reference:
# https://manual.seafile.com/13.0/config/seafevents_conf/
#
# Database, cache and Django settings come from seafile.env/seahub_settings.py;
# every option below is optional and defaults to disabled/sensible when absent.

[SEAF-EVENT-SERVER]
# The RPC-style server seaf-server talks to for real-time event processing.
# Only change if 8889 is already in use locally.
#host = 127.0.0.1
#port = 8889

[INDEX FILES]
# Full-text search indexing of file contents.
#enabled = false
# Days between full reindex passes.
#interval = 10min

[AUTO DELETION]
# Per-library auto-expiry of old files (also configurable per-library in the UI).
#enabled = false

[Syslog]
# Log to syslog in addition to the journal.
#enabled = false

### Other options ###
# LDAP sync, content/virus scanning and other pro-adjacent integrations are
# not configured here - see the manual reference above for their sections.
