# seafevents (background tasks: async email, statistics, file history, library
# auto-expiry) configuration. Reference: https://manual.seafile.com/13.0/config/seafevents_conf/
#
# Database, cache and Django settings come from seafile.env/seahub_settings.py;
# a commented-out option shows the value used when it is absent.
# The manual's search indexing section has no effect in this community build.
# LDAP sync and content/virus scanning are not covered here, see the manual.

[SEAF-EVENT-SERVER]
# The RPC-style server seaf-server talks to for real-time event processing.
# Only change if 8889 is already in use locally.
#host = 127.0.0.1
#port = 8889

[SEAHUB EMAIL]
# Emails unread notifications to users; needs the outgoing email settings in
# seahub_settings.py.
#enabled = false
#interval = 30m

[STATISTICS]
# Traffic, login and file operation statistics in System Admin > Statistics.
#enabled = false

[FILE HISTORY]
# Per-file change history for the listed suffixes.
#enabled = true
#suffix = md,txt,doc,docx,xls,xlsx,ppt,pptx,sdoc
# Minutes within which repeated edits by the same user merge into one entry.
#threshold = 5

[AUTO DELETION]
# Per-library auto-expiry of old files (also configurable per-library in the UI).
#enabled = false

[Syslog]
# Log to syslog in addition to the journal.
#enabled = false
